<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Please Don't</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <!-- the button's cozy little home -->
    <div id="room" aria-hidden="true">
      <span class="decor" style="--x:10%;--y:20%;--tilt:-14deg;--fall:-80deg;--d:.1s">🖼️</span>
      <span class="decor" style="--x:82%;--y:18%;--tilt:10deg;--fall:120deg;--d:0s">🕰️</span>
      <span class="decor shelf" style="--x:58%;--y:34%;--tilt:-8deg;--fall:6deg;--d:.2s"></span>
      <span class="decor" style="--x:60%;--y:calc(34% - 42px);--tilt:24deg;--fall:-140deg;--d:.05s">🕯️</span>
      <span class="decor" style="--x:68%;--y:calc(34% - 44px);--tilt:-30deg;--fall:200deg;--d:.12s">📚</span>
      <span class="decor big" style="--x:6%;--y:calc(80% - 64px);--tilt:-6deg;--fall:-30deg;--d:.3s">🪴</span>
      <span class="decor" style="--x:30%;--y:calc(80% - 44px);--tilt:-20deg;--fall:95deg;--d:.18s">🧸</span>
      <span class="decor big" style="--x:76%;--y:calc(80% - 66px);--tilt:5deg;--fall:15deg;--d:.4s">🛋️</span>
      <svg id="cracks" viewBox="0 0 100 100" preserveAspectRatio="none">
        <path pathLength="100" d="M18 0 L21 9 L17 15 L23 24 L20 31"/>
        <path pathLength="100" d="M66 0 L64 6 L69 11 L65 18 L70 22"/>
        <path pathLength="100" d="M100 38 L93 41 L95 47 L88 52 L90 58"/>
        <path pathLength="100" d="M0 58 L6 61 L4 67 L11 71"/>
        <path pathLength="100" d="M44 80 L46 74 L42 69 L48 63"/>
      </svg>
      <div id="graves"></div>
      <div id="puddle"></div>
    </div>

    <div id="world"></div>
    <div id="arena" hidden></div>
  </div>

  <header id="hud">
    <span class="brand">please don't.</span>
    <div class="mid">
      <span id="counter">0 / 75</span>
      <div id="bossbar" hidden></div>
    </div>
    <div class="tools">
      <button id="mute" title="Sound on/off" aria-label="Toggle sound">🔊</button>
      <button id="restart" title="Start over" aria-label="Start over">↺</button>
    </div>
  </header>

  <p id="line" aria-live="polite"></p>
  <div id="loadbar" hidden><div class="track"><div class="fill"></div></div><span>Preparing your ultimate reward…</span></div>
  <button id="again" class="pill" hidden>Play again</button>
  <div id="overlay" hidden></div>

  <script src="js/sound.js"></script>
  <script src="js/main.js"></script>
  <script src="js/boss.js"></script>
</body>
</html>
